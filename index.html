<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Phòng thí nghiệm ảo KHTN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Bố cục: nền "phòng thí nghiệm ban đêm" có chiều sâu (cực quang + hạt chuyển động), mọi khối là kính mờ nổi trên nền.
   Mỗi mạch có cặp màu riêng: Vật lí xanh điện, Hóa học tím hồng, Sinh học xanh ngọc, Trái Đất xanh trời, Chung hổ phách.
   Màn thí nghiệm: sân khấu lớn chiếm gần trọn màn hình, khay / hướng dẫn / thanh thời gian nổi trên sân khấu. */
:root{
  color-scheme:dark;
  --bg0:#060A1A; --bg1:#0B1230;
  --glass:rgba(19,27,64,.62); --glass-hi:rgba(34,46,102,.66); --glass-solid:#121A40;
  --stroke:rgba(150,170,255,.16); --stroke-hi:rgba(175,195,255,.34);
  --ink:#F1F4FF; --ink-2:#CBD3F4; --muted:#9AA5D6;
  --ly:#4C8DFF; --ly2:#3DE0FF; --hoa:#A66BFF; --hoa2:#FF6BD6; --sinh:#22D3A0; --sinh2:#B6F05A;
  --td:#29C5F6; --td2:#8A7DFF; --chung:#FFB547; --chung2:#FF7A59;
  --star:#FFD15C; --on-star:#2A1B00;
  --btn:#F1F4FF; --on-btn:#0B1230;
  --stage1:#0E1640; --stage2:#04071A; --stage-ink:#FFFFFF; --gridc:rgba(150,175,255,.16);
  --link-rgb:150,170,255;
  --shadow:0 24px 60px -28px rgba(0,0,0,.75);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:22px; --r-md:16px; --r-sm:12px;
}
html.day{
  color-scheme:light;
  --bg0:#E8EEFF; --bg1:#F6F8FF;
  --glass:rgba(255,255,255,.74); --glass-hi:rgba(255,255,255,.92); --glass-solid:#FFFFFF;
  --stroke:rgba(40,60,150,.14); --stroke-hi:rgba(40,60,150,.3);
  --ink:#0D1433; --ink-2:#28336A; --muted:#55608E;
  --ly:#2563EB; --ly2:#0891B2; --hoa:#7C3AED; --hoa2:#DB2777; --sinh:#059669; --sinh2:#65A30D;
  --td:#0284C7; --td2:#6D5BD0; --chung:#D97706; --chung2:#EA580C;
  --star:#E6A400; --on-star:#2A1B00;
  --btn:#0D1433; --on-btn:#FFFFFF;
  --stage1:#FFFFFF; --stage2:#DCE5FF; --stage-ink:#1A2456; --gridc:rgba(40,60,150,.13);
  --link-rgb:50,70,160;
  --shadow:0 22px 50px -30px rgba(30,40,110,.45);
}
html{font-size:16px} html.big{font-size:19px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 620px at 8% -8%,color-mix(in srgb,var(--hoa) 24%,transparent),transparent 62%),
             radial-gradient(1000px 640px at 100% 0%,color-mix(in srgb,var(--ly) 22%,transparent),transparent 62%),
             radial-gradient(900px 600px at 50% 112%,color-mix(in srgb,var(--sinh) 16%,transparent),transparent 62%),var(--bg0);
  background-attachment:fixed}
h1,h2,h3{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ly2);outline-offset:3px;border-radius:10px}
.mono{font-family:var(--f-mono);font-size:.8em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-inline:24px}
.wrap.wide{max-width:1640px}

/* Nền động */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.28}
.aurora i:nth-child(1){background:var(--hoa);left:-12vmax;top:-14vmax;animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--ly);right:-14vmax;top:8vmax;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:var(--sinh);left:22vmax;bottom:-22vmax;animation:drift3 30s ease-in-out infinite alternate;opacity:.2}
html.day .aurora i{opacity:.18}
@keyframes drift1{to{transform:translate(10vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,6vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.1)}}

/* Kính */
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}

/* Thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-width:0 0 1px}
.top-in{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.brand b{display:block;font-family:var(--f-display);font-size:1.12rem;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--ly),var(--hoa),var(--hoa2),var(--sinh),var(--ly));box-shadow:0 8px 24px -8px color-mix(in srgb,var(--hoa) 70%,transparent)}
.logo svg{width:26px;height:26px}
.nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.nav button{border:0;background:none;padding:0 16px;border-radius:999px;font-weight:600;color:var(--muted);min-height:44px}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--glass-hi);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--glass-hi);border:1px solid var(--stroke);gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:0 16px;min-height:38px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass-hi);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.ibtn[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:transparent}
.ibtn svg{width:20px;height:20px}

main{padding-block:22px 30px}
main.tight{padding-block:14px 24px}
#app>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:1.45rem}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Nút */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass-hi);font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--stroke-hi)}
.btn.main{background:var(--btn);color:var(--on-btn);border-color:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass-hi);display:grid;place-items:center;flex:none}
.round svg{width:22px;height:22px}

/* Mạch */
.m-L{--m:var(--ly);--m2:var(--ly2)} .m-T{--m:var(--td);--m2:var(--td2)} .m-H{--m:var(--hoa);--m2:var(--hoa2)} .m-S{--m:var(--sinh);--m2:var(--sinh2)} .m-C{--m:var(--chung);--m2:var(--chung2)}
.tag{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--m) 18%,transparent);color:color-mix(in srgb,var(--m) 70%,var(--ink));border:1px solid color-mix(in srgb,var(--m) 35%,transparent);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--m),var(--m2));flex:none;box-shadow:0 0 10px var(--m)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;border:1px solid var(--stroke);color:var(--ink-2);background:var(--glass-hi);white-space:nowrap}
.soon{color:var(--star);border-color:color-mix(in srgb,var(--star) 40%,transparent);background:color-mix(in srgb,var(--star) 12%,transparent)}
.soon::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--star);box-shadow:0 0 8px var(--star)}

/* Biểu tượng thí nghiệm */
.gl{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.gl .a{fill:var(--g2,currentColor);stroke:none}
.gl .s{stroke:var(--g2,currentColor)}
.gl .f{fill:currentColor;stroke:none}
.gl .d{stroke:var(--gd,#0B1230)}
.gl text{fill:currentColor;stroke:none;font-family:var(--f-display)}

/* Sảnh */
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(2.1rem,4.8vw,3.6rem);font-weight:800;letter-spacing:-.025em;margin-top:14px}
.grad{background:linear-gradient(90deg,var(--ly2),var(--hoa2),var(--sinh2),var(--ly2));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.hero p.lead{font-size:1.12rem;color:var(--ink-2);max-width:56ch;margin-top:16px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap}
.search{position:relative;margin-top:26px;max-width:620px}
.search input{width:100%;min-height:62px;border-radius:18px;border:1px solid var(--stroke-hi);background:var(--glass-hi);padding:0 20px 0 56px;font-size:1.05rem;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted)}
.mach-quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.mq{display:inline-flex;align-items:center;gap:10px;padding:0 16px;min-height:46px;border-radius:14px;border:1px solid color-mix(in srgb,var(--m) 40%,transparent);background:color-mix(in srgb,var(--m) 14%,var(--glass));font-weight:700}
.mq b{font-family:var(--f-display);color:color-mix(in srgb,var(--m2) 70%,var(--ink))}
.orb{position:relative;aspect-ratio:1;max-width:460px;width:100%;justify-self:center}
.orb svg{width:100%;height:100%;display:block}
.orb-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.orb-key{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.resume{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:var(--r);flex-wrap:wrap}
.resume .thumb-s{width:64px;height:64px;border-radius:16px;flex:none}
.resume .txt{flex:1;min-width:200px}

.portals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.portal{position:relative;border-radius:var(--r);overflow:hidden;text-align:left;padding:0;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--shadow);display:flex;flex-direction:column;transform-style:preserve-3d;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.portal:hover{border-color:var(--stroke-hi);box-shadow:0 30px 70px -30px color-mix(in srgb,var(--pg) 70%,transparent)}
.portal::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),transparent 45%);opacity:0;transition:opacity .25s}
.portal:hover::after{opacity:1}
.scene-wrap{position:relative;height:156px;overflow:hidden}
.scene-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.g6{--pg:#5B5BFF;--sk1:#121650;--sk2:#2A1C68} .g7{--pg:#1FB6FF;--sk1:#08203F;--sk2:#0B3D63} .g8{--pg:#C84BFF;--sk1:#220D45;--sk2:#46124F} .g9{--pg:#24D8B0;--sk1:#062C33;--sk2:#0F2550}
.scene-wrap{background:radial-gradient(120% 120% at 70% 0%,var(--sk2),var(--sk1))}
.portal .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.gtitle{display:flex;align-items:baseline;gap:10px}
.gtitle .n{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:.9;letter-spacing:-.04em;background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--pg) 60%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.gtitle .t{font-weight:700;color:var(--ink-2);line-height:1.3}
.split{display:flex;height:8px;border-radius:999px;overflow:hidden;gap:3px}
.split i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--m),var(--m2))}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.88rem;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend b{margin-left:auto;font-family:var(--f-display);color:var(--ink)}
.portal .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-top:12px;border-top:1px solid var(--stroke)}
.portal .go .arr{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:var(--on-btn)}

.machs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.mportal{position:relative;border-radius:var(--r);overflow:hidden;text-align:left;padding:0;border:1px solid color-mix(in srgb,var(--m) 35%,var(--stroke));box-shadow:var(--shadow);background:linear-gradient(160deg,color-mix(in srgb,var(--m) 34%,var(--glass-solid)),var(--glass-solid) 70%);display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
.mportal:hover{box-shadow:0 30px 70px -30px color-mix(in srgb,var(--m) 80%,transparent)}
.mportal .scene-wrap{height:150px;background:radial-gradient(120% 120% at 30% 0%,color-mix(in srgb,var(--m) 45%,#050818),#050818)}
.mportal .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px}
.mportal h3{font-size:1.35rem;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mportal h3 b{font-size:2rem;font-weight:800;line-height:1;color:color-mix(in srgb,var(--m2) 65%,var(--ink))}
.mportal h3 b small{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:6px}
.mportal p{color:var(--ink-2);font-size:.95rem}
.mportal .cnt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.toolcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 24px;border-radius:var(--r);text-align:left;box-shadow:var(--shadow)}
.mini-pt{display:grid;grid-template-columns:repeat(8,18px);gap:4px}
.mini-pt i{width:18px;height:18px;border-radius:5px;background:var(--glass-hi);border:1px solid var(--stroke)}
.mini-pt i.on{animation:blink 3.6s ease-in-out infinite}
@keyframes blink{0%,100%{background:var(--glass-hi)}40%{background:color-mix(in srgb,var(--hoa) 60%,transparent)}}

footer{position:relative;z-index:1;padding-block:20px 30px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--stroke);padding-top:20px}
footer button{border:0;background:none;padding:0;color:var(--ink-2);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Trang lớp / mạch */
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.band .info{padding:28px 30px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.band h1{font-size:clamp(1.8rem,3.6vw,2.7rem);font-weight:800}
.band .scene-wrap{height:auto;min-height:220px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--ink-2);font-weight:600;min-height:32px}
.filters{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);font-weight:700;backdrop-filter:blur(12px)}
.chip .c{font-family:var(--f-display);color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--m,var(--ink)) 22%,var(--glass-hi));border-color:color-mix(in srgb,var(--m,var(--ink)) 60%,transparent);box-shadow:0 8px 24px -12px var(--m,transparent)}
.chip[aria-pressed="true"] .c{color:var(--ink)}
.chip.all{--m:var(--ink-2)}
.group{display:flex;flex-direction:column;gap:16px}
.group-h{display:flex;align-items:center;gap:12px}
.group-h h2{font-size:1.3rem}
.group-h .line{flex:1;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--m) 50%,transparent),transparent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.xcard{position:relative;border-radius:20px;overflow:hidden;text-align:left;padding:0;border:1px solid var(--stroke);background:var(--glass);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;backdrop-filter:blur(14px)}
.xcard:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--m) 60%,transparent);box-shadow:0 26px 60px -28px color-mix(in srgb,var(--m) 85%,transparent)}
.thumb{position:relative;height:138px;display:grid;place-items:center;color:#fff;--g2:color-mix(in srgb,var(--m2) 70%,#fff);--gd:color-mix(in srgb,var(--m) 70%,#000);
  background:radial-gradient(110% 90% at 18% 0%,color-mix(in srgb,var(--m2) 60%,transparent),transparent 60%),linear-gradient(140deg,color-mix(in srgb,var(--m) 90%,#060A1A),color-mix(in srgb,var(--m) 42%,#060A1A))}
.thumb::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px);background-size:14px 14px;mask-image:linear-gradient(180deg,#000,transparent)}
.thumb .gl{width:76px;height:76px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35)) drop-shadow(0 0 18px color-mix(in srgb,var(--m2) 60%,transparent));transition:transform .3s ease}
.xcard:hover .thumb .gl{transform:scale(1.08) rotate(-3deg)}
.thumb .code{position:absolute;left:12px;top:12px;padding:3px 9px;border-radius:8px;background:rgba(5,8,24,.45);color:#fff;font-family:var(--f-mono);font-size:.74rem;font-weight:700;backdrop-filter:blur(6px)}
.thumb .kind{position:absolute;right:12px;top:12px;display:flex;gap:5px}
.thumb .kind span{padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-size:.72rem;font-weight:700}
.xcard .body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.xcard .title{font-weight:700;font-size:1.04rem;line-height:1.38}
.xcard .meta{font-size:.86rem;color:var(--muted)}
.xcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--stroke)}
.xcard .foot .arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--m),var(--m2));color:#fff}
.empty{border:1px dashed var(--stroke-hi);border-radius:var(--r);padding:30px;text-align:center;color:var(--ink-2);background:var(--glass)}

/* Màn thí nghiệm */
.studio{display:flex;flex-direction:column;gap:14px}
.shead{display:flex;align-items:center;gap:16px;padding:10px 12px 10px 10px;border-radius:20px;flex-wrap:wrap}
.shead .ttl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.shead h1{font-size:clamp(1.2rem,2.2vw,1.6rem);font-weight:700}
.shead .chips2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem}
.shead .acts{display:flex;gap:8px;flex-wrap:wrap}
.legendbox{display:none;border-radius:20px;padding:16px 20px}
.notes-on .legendbox{display:block}
.legendbox ol{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 22px}
.legendbox li{display:flex;gap:12px;font-size:.93rem;color:var(--ink-2)}
.legendbox li b,.pin{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--star);color:var(--on-star);font-family:var(--f-display);font-weight:800;font-size:.85rem;box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 30%,transparent)}
.studio .pin{position:absolute;z-index:6;display:none}
.studio.notes-on .pin{display:grid}
.notes-on .dock,.notes-on .guide,.notes-on .timebar,.notes-on .center-area .cap{outline:2px dashed color-mix(in srgb,var(--star) 80%,transparent);outline-offset:4px}

.stage{position:relative;border-radius:26px;overflow:hidden;min-height:clamp(540px,calc(100vh - 196px),1000px);border:1px solid var(--stroke);box-shadow:var(--shadow);
  background:radial-gradient(90% 80% at 50% 25%,color-mix(in srgb,var(--m) 26%,var(--stage1)),var(--stage2) 75%)}
.viewport{position:absolute;inset:0;overflow:hidden}
.floor{position:absolute;left:-60%;right:-60%;bottom:-18%;height:72%;transform:perspective(560px) rotateX(72deg);transform-origin:50% 100%;
  background-image:linear-gradient(var(--gridc) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--gridc) 1.5px,transparent 1.5px);background-size:56px 56px;
  -webkit-mask-image:linear-gradient(to top,#000 20%,transparent 92%);mask-image:linear-gradient(to top,#000 20%,transparent 92%);animation:floorMove 7s linear infinite}
@keyframes floorMove{to{background-position:0 56px}}
.spot{position:absolute;left:50%;top:-10%;width:70%;height:90%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--m2) 26%,transparent),transparent 65%);pointer-events:none}
.center-area{position:absolute;top:0;bottom:92px;left:128px;right:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.guide-closed .center-area{right:20px}
.present .center-area{left:20px;right:20px}
.obj{position:relative;color:var(--stage-ink);--g2:var(--m2);--gd:var(--stage2)}
.obj .gl{width:clamp(150px,22vw,240px);height:auto;aspect-ratio:1;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--m2) 55%,transparent));animation:float 5s ease-in-out infinite}
.obj::after{content:"";position:absolute;left:10%;right:10%;bottom:-26px;height:22px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--m) 55%,transparent),transparent);animation:shadowP 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes shadowP{50%{transform:scale(.82);opacity:.6}}
.cap{position:relative;max-width:460px;text-align:center;padding:14px 20px;border-radius:18px}
.cap .ch{display:block;font-family:var(--f-display);font-size:1.1rem;font-weight:700}
.cap .ct{display:block;color:var(--ink-2);font-size:.92rem;margin-top:4px}
.dock{position:absolute;left:16px;top:16px;bottom:92px;width:100px;border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:4}
.dock .zh{font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.3}
.slot{width:64px;height:64px;border-radius:16px;border:1.5px dashed var(--stroke-hi);display:grid;place-items:center;color:var(--muted);font-size:.66rem;font-weight:700;text-align:center;line-height:1.2;background:color-mix(in srgb,var(--m) 8%,transparent)}
.guide{position:absolute;right:16px;top:16px;bottom:92px;width:350px;border-radius:22px;z-index:4;display:flex}
.guide-in{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-radius:inherit;overscroll-behavior:contain}
.guide-in>*{flex-shrink:0}
.guide-in{min-width:0}
.snav .btn{white-space:normal;line-height:1.2;text-align:center}
.guide-closed .guide{display:none}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--stroke);background:var(--glass-hi);border-radius:14px;min-height:66px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;font-weight:700;color:var(--muted);line-height:1.2;text-align:center}
.step b{font-family:var(--f-display);font-size:1.1rem}
.step[aria-current="step"]{background:linear-gradient(135deg,var(--m),var(--m2));color:#fff;border-color:transparent;box-shadow:0 10px 24px -12px var(--m)}
.step.done{color:var(--ink);border-color:color-mix(in srgb,var(--m) 50%,transparent)}
.sbody{border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--m) 10%,var(--glass-hi));border:1px solid color-mix(in srgb,var(--m) 25%,transparent);display:flex;flex-direction:column;gap:6px;min-height:132px}
.sbody h3{font-size:1.02rem}
.sbody p{font-size:.93rem;color:var(--ink-2)}
.snav{display:flex;gap:8px}
.snav .btn{flex:1}
details.box{border-radius:16px;border:1px solid var(--stroke);background:var(--glass-hi);position:relative}
details.box summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:46px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";font-family:var(--f-display);font-size:1.2rem;color:var(--muted)}
details.box[open] summary::after{content:"–"}
details.box .in{padding:0 14px 14px;font-size:.9rem;color:var(--ink-2)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--stroke)}
th{font-size:.72rem;font-weight:700;letter-spacing:.01em;color:var(--muted)}
.tlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.timebar{position:absolute;left:128px;right:380px;bottom:16px;min-height:60px;border-radius:18px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:12px;z-index:4}
.guide-closed .timebar{right:20px}
.timebar .ctl{display:flex;gap:6px}
.timebar .ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass-hi);display:grid;place-items:center;opacity:.45;cursor:not-allowed}
.timebar .ctl svg{width:18px;height:18px}
.timebar .track{flex:1;height:6px;border-radius:999px;background:var(--glass-hi);position:relative;min-width:80px}
.timebar .track::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--m),var(--m2))}
.timebar .note{font-size:.8rem;color:var(--muted);max-width:220px;line-height:1.35}
.gtoggle{position:absolute;right:16px;top:16px;z-index:5;display:none}
.guide-closed .gtoggle{display:inline-flex}
.present .dock,.present .guide,.present .gtoggle{display:none!important}
.present .timebar{left:20px;right:20px}
.present .stage{min-height:calc(100vh - 128px)}
body.presenting .top,body.presenting footer{display:none}
.studio:fullscreen{background:var(--bg0);padding:16px;overflow:auto}
.studio:fullscreen .stage{min-height:calc(100vh - 140px)}

/* Tra cứu */
.tabs{display:inline-flex;gap:4px;padding:5px;border-radius:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:12px;padding:0 18px;min-height:44px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--on-btn)}
.pt-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.pt-scroll{overflow-x:auto;padding:4px 2px 8px}
.pt{display:grid;grid-template-columns:32px repeat(8,minmax(58px,1fr));gap:7px;min-width:560px}
.pt .gh,.pt .ph{display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.el{--k:var(--muted);position:relative;min-height:80px;border-radius:14px;border:1px solid color-mix(in srgb,var(--k) 40%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--k) 26%,var(--glass-solid)),color-mix(in srgb,var(--k) 8%,var(--glass-solid)));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .18s ease,box-shadow .18s ease}
.el:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px var(--k)}
.el .z{position:absolute;left:8px;top:5px;font-size:.66rem;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.el .sym{font-family:var(--f-display);font-size:1.45rem;font-weight:800;line-height:1.05}
.el .nm{font-size:.62rem;color:var(--ink-2);max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el.kl{--k:var(--chung)} .el.pk{--k:var(--sinh)} .el.kh{--k:var(--hoa2)}
.el[aria-pressed="true"]{box-shadow:0 0 0 2px var(--k),0 14px 30px -12px var(--k)}
.keyrow{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2);align-items:center}
.keyrow span{display:inline-flex;align-items:center;gap:7px}
.keyrow i{width:14px;height:14px;border-radius:4px;background:var(--k);box-shadow:0 0 10px var(--k)}
.ecard{display:flex;flex-direction:column;gap:16px}
.ecard .top2{display:flex;gap:16px;align-items:center}
.bigsym{width:88px;height:88px;border-radius:22px;display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--k),color-mix(in srgb,var(--k) 50%,#060A1A));box-shadow:0 16px 36px -16px var(--k);flex:none}
.bohr-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;justify-items:center}
.bohr{width:240px;height:240px;max-width:100%}
.bohr-wrap .kv{width:100%;padding-top:14px;border-top:1px solid var(--stroke)}
.bohr .shell{transform-box:view-box;transform-origin:110px 110px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.fcard{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.fcard h3{font-size:1.02rem}
.fcard ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tool{border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:.92rem;min-height:64px}
.tool i{width:34px;height:34px;border-radius:10px;border:1.5px dashed var(--stroke-hi);flex:none}

/* Thông tin hệ thống */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fbox{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px}
.fbox h3{font-size:1.02rem}
.fbox ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:.9rem}
.fbox .arrow{margin-top:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
pre.tree{border-radius:20px;padding:18px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.65;margin:0;color:var(--ink-2)}

/* Cảnh minh họa */
.twinkle{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(.98)}45%{transform:scale(1.06)}}
.rung{transform-box:fill-box;transform-origin:center;animation:rung 3.2s ease-in-out infinite}
@keyframes rung{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.swing{transform-box:view-box;animation:swing 1.8s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
.sway{transform-box:fill-box;transform-origin:20% 90%;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
.flowd{stroke-dasharray:7 9;animation:flowd 1.2s linear infinite}
@keyframes flowd{to{stroke-dashoffset:-32}}
.ecg{stroke-dasharray:180;stroke-dashoffset:180;animation:ecg 2.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-180}}
.shimmer{animation:shim 2.6s ease-in-out infinite}
@keyframes shim{50%{opacity:.55}}

html.nomotion *,html.nomotion *::before,html.nomotion *::after{animation:none!important;transition:none!important}

/* Bộ chạy thí nghiệm */
.pill.live{color:var(--sinh);border-color:color-mix(in srgb,var(--sinh) 45%,transparent);background:color-mix(in srgb,var(--sinh) 14%,transparent)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sinh);box-shadow:0 0 8px var(--sinh)}
.viewport.live{background:var(--stage2)}
.viewport.live canvas.stagecv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);text-align:center;padding:20px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--stroke-hi);border-top-color:var(--m2);animation:spin .9s linear infinite}
.toasts{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:8;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{pointer-events:auto;padding:10px 16px;border-radius:14px;font-size:.92rem;font-weight:600;background:var(--glass-solid);border:1px solid var(--stroke-hi);box-shadow:var(--shadow);animation:rise .3s ease both;text-align:center;max-width:100%}
.toast.ok{border-color:color-mix(in srgb,var(--sinh) 60%,transparent)} .toast.warn{border-color:color-mix(in srgb,var(--star) 70%,transparent)} .toast.danger{border-color:#FF5D7E;background:color-mix(in srgb,#FF5D7E 18%,var(--glass-solid))}
.toast.out{opacity:0;transform:translateY(-6px);transition:.35s}
.dock-in{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:100%;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.dock-in::-webkit-scrollbar{display:none}
.dock-in>*{flex-shrink:0}
.dock-in.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
.dock .more-hint{display:none;position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:22px;height:14px;color:var(--muted);pointer-events:none}
.dock.has-more .more-hint{display:block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translate(-50%,3px)}}
.tseg,.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.tseg .titem,.tgrid .titem{min-width:0;overflow-wrap:break-word;word-break:normal;hyphens:manual}
@media (min-width:981px){.dock:has(.tgrid),.dock:has(.tseg){width:136px}}
.tseg .titem{padding:5px 1px;font-size:.58rem;gap:1px;border-radius:11px;letter-spacing:-.01em}.tseg .titem svg{width:20px;height:20px}
.tgrid .titem{padding:5px 2px;font-size:.62rem;gap:2px}.tgrid .titem svg{width:26px;height:26px}
.dock-in hr{border:0;border-top:1px solid var(--stroke);margin:0 4px}
.titem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass-hi);font-size:.68rem;font-weight:700;line-height:1.2;text-align:center;color:var(--ink-2)}
.titem svg{width:30px;height:30px}
.titem[aria-pressed="true"]{background:color-mix(in srgb,var(--m) 26%,var(--glass-hi));border-color:color-mix(in srgb,var(--m) 60%,transparent);color:var(--ink)}
.live-body{min-height:0;gap:10px}
.live-body h3{font-size:1.05rem}
.live-body .lead2{font-size:.93rem;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);font-weight:600;font-size:.94rem}
.opt[aria-pressed="true"]{border-color:var(--m);background:color-mix(in srgb,var(--m) 22%,var(--glass));box-shadow:0 0 0 1px var(--m) inset}
.opt .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--glass-hi);font-family:var(--f-display);font-size:.8rem;flex:none}
.opt.right{border-color:var(--sinh);background:color-mix(in srgb,var(--sinh) 18%,var(--glass))}
.opt.wrong{border-color:#FF5D7E;background:color-mix(in srgb,#FF5D7E 14%,var(--glass))}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chipset button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);font-size:.84rem;font-weight:600}
.chipset button[aria-pressed="true"]{border-color:var(--m);background:color-mix(in srgb,var(--m) 22%,var(--glass))}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);font-size:.9rem}
.todo li .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--stroke-hi);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:transparent}
.todo li.done .tick{background:var(--sinh);border-color:var(--sinh);color:#04201A}
.todo li.now{border-color:color-mix(in srgb,var(--m) 60%,transparent);background:color-mix(in srgb,var(--m) 12%,var(--glass))}
.todo li .act{margin-top:6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:10px}
.btn.sm svg{width:15px;height:15px}
.round.sm{width:34px;height:34px;font-size:.9rem;font-weight:800}
.callout{padding:10px 12px;border-radius:12px;font-size:.86rem;line-height:1.45;border:1px solid var(--stroke);background:var(--glass)}
.callout.warn{border-color:color-mix(in srgb,var(--star) 55%,transparent);background:color-mix(in srgb,var(--star) 10%,var(--glass))}
.callout.ok{border-color:color-mix(in srgb,var(--sinh) 55%,transparent);background:color-mix(in srgb,var(--sinh) 10%,var(--glass))}
.callout.bad{border-color:#FF5D7E;background:color-mix(in srgb,#FF5D7E 10%,var(--glass))}
.callout b{color:var(--ink)}
.eq{font-family:var(--f-display);font-weight:600;font-size:1.02rem;padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);text-align:center;line-height:1.6}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.cmp .v{padding:10px 6px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke)}
.cmp .v small{display:block;color:var(--muted);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cmp .v b{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.cmp .op{font-family:var(--f-display);font-size:1.4rem;font-weight:800;color:var(--m2)}
.atoms{width:100%;border-collapse:collapse;font-size:.86rem}
.atoms th,.atoms td{padding:6px 8px;border-bottom:1px solid var(--stroke);text-align:center}
.atoms th:first-child,.atoms td:first-child{text-align:left}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{width:110px;min-height:42px;border-radius:10px;border:1px solid var(--stroke-hi);background:var(--glass);padding:0 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.cnt-badge{margin-left:6px;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--btn);color:var(--on-btn)}
.cnt-badge:empty{display:none}
.tbl-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dtable td.num{font-variant-numeric:tabular-nums;font-weight:700}
.dtable tr.flash td{animation:flashrow 1.4s ease}
@keyframes flashrow{0%{background:color-mix(in srgb,var(--sinh) 40%,transparent)}100%{background:transparent}}
.timebar .ctl button{opacity:1;cursor:pointer}
.timebar .ctl button.armed{width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center;border-color:var(--star);color:var(--star);font-size:.8rem;font-weight:700}
.timebar .spd button{min-height:34px;padding:0 10px;font-size:.82rem}
.timebar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,var(--m),var(--m2));width:0}
.studio.is-live .timebar .track::after{display:none}
.timebar .note{min-width:96px;text-align:right;color:var(--ink-2);font-weight:600}
.infocard{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow);animation:cardin .25s ease both}
@keyframes cardin{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.infocard #closeCard{position:absolute;right:10px;top:10px}
.infocard h3{font-size:1.15rem;padding-right:40px}
.infocard .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.infocard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:.9rem}
.infocard dt{color:var(--muted)} .infocard dd{margin:0;font-weight:600}
.ghs{display:flex;gap:10px;align-items:center;margin-top:12px}
.ghs svg{width:46px;height:46px;flex:none}
.done-ov{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:color-mix(in srgb,var(--bg0) 55%,transparent);backdrop-filter:blur(4px);padding:16px}
.done-card{max-width:480px;width:100%;border-radius:24px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.done-card .stars{display:flex;justify-content:center;gap:10px}
.done-card .stars svg{width:52px;height:52px;fill:var(--star);filter:drop-shadow(0 0 12px var(--star));animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.done-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.studio.is-live .viewport .pin{transform:translateX(-50%)}
.samples{display:flex;flex-direction:column;gap:8px}
.smp{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);font-size:.88rem}
.schbox{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--stroke);color:var(--ink)}
.schbox svg{width:100%;height:auto;display:block;max-height:190px}


/* ===== Thẻ ảnh thật, danh sách sắp ra mắt, chân trang, chuyển động ===== */
.xcard .thumb.shot{height:auto;aspect-ratio:16/10;background:#060A1A;display:block;overflow:hidden}
.xcard .thumb.shot::before{display:none}
.xcard .thumb.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.xcard:hover .thumb.shot img{transform:scale(1.07)}
.xcard .thumb.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,22,.25),transparent 30%,transparent 62%,rgba(4,7,22,.5));pointer-events:none}
.thumb .lop{position:absolute;left:12px;top:12px;z-index:1;padding:4px 11px;border-radius:999px;background:rgba(5,8,24,.58);color:#fff;font-size:.76rem;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2)}
.xcard .subj{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:color-mix(in srgb,var(--m2) 55%,var(--ink-2))}
.xcard .foot{padding-top:10px}
.xcard .foot .meta{font-size:.84rem;color:var(--muted)}
.xcard .foot .arr{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.xcard:hover .foot .arr{transform:translateX(4px)}
.allrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.soon-box{border-radius:var(--r);border:1px solid var(--stroke);background:var(--glass)}
.soon-box>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;min-height:50px}
.soon-box>summary::-webkit-details-marker{display:none}
.soon-box>summary .c{font-family:var(--f-display);color:var(--muted)}
.soon-box>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .25s}
.soon-box[open]>summary::after{transform:rotate(225deg)}
.soonlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;padding:0 12px 12px}
.srow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass-hi);font-size:.9rem;min-width:0}
.srow .nm{flex:1;min-width:0;color:var(--ink-2);line-height:1.35}
.srow .bai{color:var(--muted);font-size:.78rem;white-space:nowrap}
.soonpage{display:grid;place-items:center;text-align:center;gap:14px;padding:56px 20px;border-radius:28px}
.soonpage .gl{width:120px;height:120px;color:var(--m2);filter:drop-shadow(0 0 24px color-mix(in srgb,var(--m2) 50%,transparent))}
.pcount{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2)}
.pcount span{display:inline-flex;align-items:center;gap:7px}
.pcount b{font-family:var(--f-display);color:var(--ink)}
footer .fbrand{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;border-top:1px solid var(--stroke);padding-top:20px}
footer .who{display:flex;align-items:center;gap:14px;min-width:0}
footer .who small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
footer .who b{display:block;font-family:var(--f-display);font-size:1.08rem;color:var(--ink);font-weight:700}
footer .contact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
footer .contact a,footer .contact span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass-hi);color:var(--ink);font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums;user-select:all}
footer .contact span{user-select:auto;font-weight:600;color:var(--ink-2)}
footer .contact svg{width:16px;height:16px}
footer .fcopy{margin-top:12px;font-size:.8rem;color:var(--muted)}
/* chuyển động */
html.rv [data-reveal]{opacity:0;transform:translateY(22px) scale(.985);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(min(var(--i,0),10)*55ms)}
html.rv [data-reveal].in{opacity:1;transform:none}
html.rv .xcard[data-reveal].in:hover{transform:translateY(-5px)}
.hero h1 .w{display:inline-block;animation:wordin .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--w)*85ms + 60ms)}
@keyframes wordin{from{opacity:0;transform:translateY(.45em) rotate(1.5deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero .lead,.hero .search,.hero .mach-quick,.hero .badge-row{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.hero .badge-row{animation-delay:.05s}.hero .lead{animation-delay:.35s}.hero .search{animation-delay:.45s}.hero .mach-quick{animation-delay:.55s}
.orb{animation:orbin 1.2s cubic-bezier(.2,.8,.2,1) both .2s}
@keyframes orbin{from{opacity:0;transform:scale(.86) rotate(-8deg)}to{opacity:1;transform:none}}
.top{transition:box-shadow .3s,background .3s}
.top.scrolled{box-shadow:0 12px 30px -20px rgba(0,0,0,.7)}
.btn,.chip,.mq,.seg button,.ibtn,.round{transition:transform .15s ease,background .2s,border-color .2s,color .2s}
.btn:active,.chip:active,.mq:active,.ibtn:active,.round:active{transform:scale(.96)}
.portal .scene-wrap>*,.mportal .scene-wrap>*{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.portal:hover .scene-wrap>*,.mportal:hover .scene-wrap>*{transform:scale(1.06)}
.scene-wrap.shotmix{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#060A1A}
.scene-wrap.shotmix.one{grid-template-columns:1fr}
.scene-wrap.shotmix img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.scene-wrap.shotmix::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(4,7,22,.45));pointer-events:none}
::view-transition-old(root){animation:vtOut .2s ease both}
::view-transition-new(root){animation:vtIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px)}}
html.nomotion [data-reveal]{opacity:1!important;transform:none!important}
.stat{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ===== Lớp phủ cảnh 3D: nhãn, bảng pha, chú giải ===== */
.gl-over{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.gl-hots{position:absolute;inset:0;pointer-events:none}
.gl-hot{position:absolute;width:0;height:0}
.gl-hot i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#FFD15C;box-shadow:0 0 0 3px rgba(10,14,40,.45),0 0 14px rgba(255,209,92,.9)}
.gl-hot i::before{content:"";position:absolute;left:-12px;top:-12px;width:34px;height:34px;box-sizing:border-box;border-radius:50%;border:2.5px solid #FFD15C;animation:hotp 1.7s ease-out infinite}
.gl-hot b{position:absolute;left:0;top:22px;transform:translateX(-50%);white-space:nowrap;font:700 12px/1.3 var(--f-body);color:#fff;background:rgba(10,14,40,.88);border:1px solid rgba(255,209,92,.6);padding:3px 9px;border-radius:9px;opacity:0;transition:opacity .2s}
.gl-hot.tip b{opacity:1}
.gl-hot.r b{transform:translateX(calc(-100% + 18px))}.gl-hot.l b{transform:translateX(-18px)}.gl-hot.u b{top:auto;bottom:22px}
.gl-over.day .gl-hot b{background:rgba(255,255,255,.95);color:#0D1433}
@keyframes hotp{0%{transform:scale(.75);opacity:1}70%{transform:scale(1.25);opacity:.25}100%{transform:scale(1.3);opacity:0}}
html.nomotion .gl-hot i::before{animation:none}
.gl-menu{position:absolute;left:0;top:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:260px;pointer-events:auto;transform:translate(-50%,-100%);padding:6px;border-radius:16px;background:rgba(7,10,28,.78);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 12px 28px -12px rgba(0,0,0,.7);animation:menuIn .18s ease both}
.gl-menu[hidden]{display:none}
.gl-menu button{font:700 .74rem/1.15 var(--f-body,system-ui);color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:11px;padding:7px 10px;min-height:34px;cursor:pointer;white-space:nowrap}
.gl-menu button:hover{background:rgba(255,255,255,.2)}
.gl-menu button.main{background:linear-gradient(135deg,var(--m),var(--m2));border-color:transparent}
.gl-menu button:disabled{opacity:.45;cursor:default}
.gl-over.day .gl-menu{background:rgba(255,255,255,.94);border-color:rgba(40,60,150,.2)}
.gl-over.day .gl-menu button{color:#0D1433;background:rgba(13,20,51,.06);border-color:rgba(13,20,51,.14)}
.gl-over.day .gl-menu button.main{color:#fff}
@keyframes menuIn{from{opacity:0;transform:translate(-50%,calc(-100% + 6px))}}
.gl-lens{position:absolute;pointer-events:none}
.gl-card{position:absolute;width:232px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--ink);pointer-events:none}
.gl-card .tile{border-radius:14px;padding:9px 12px;background:linear-gradient(150deg,#8B5CF6,#4C1D95);color:#fff;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 10px 22px -12px rgba(0,0,0,.7)}
.gl-card .tile{flex:0 0 auto}
.gl-card .tile.none{background:linear-gradient(150deg,#64748B,#334155)}
.gl-card .tile .sym{font-family:var(--f-display);font-size:2.3rem;font-weight:800;line-height:1;grid-row:span 2;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.gl-card .tile .z{font-weight:800;font-size:.78rem;opacity:.9}
.gl-card .tile .nm{font-weight:700;font-size:.92rem}
.gl-card .cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gl-card .cnt div{border-radius:10px;padding:5px 4px;background:var(--glass-hi);border:1px solid var(--stroke);text-align:center;font-size:.68rem;color:var(--muted)}
.gl-card .cnt b{display:block;font-family:var(--f-display);font-size:1.12rem;color:var(--ink);font-variant-numeric:tabular-nums}
.gl-card .cnt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.gl-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.78rem;margin:0}
.gl-card dt{color:var(--muted);font-weight:600}.gl-card dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.gl-card .note{font-size:.72rem;color:var(--muted);line-height:1.35}
@media (max-width:640px){.gl-card{width:auto;padding:8px;flex-direction:row;align-items:center;gap:10px}.gl-card .tile{padding:6px 9px}.gl-card .tile .sym{font-size:1.7rem}.gl-card .cnt,.gl-card .note{display:none}.gl-card dl{font-size:.7rem;flex:1}}
.gl-lab{position:absolute;left:0;top:0;white-space:nowrap;transition:opacity .25s;will-change:transform}
.gl-lab.hid{opacity:0}
.gl-lab>span small{display:block;font-weight:500;font-size:.86em;opacity:.82;text-align:center;margin-top:1px}
.gl-lab>span{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(7,10,28,.78);color:#fff;font-size:.74rem;font-weight:700;line-height:1.3;border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 16px -8px rgba(0,0,0,.7)}
.gl-lab>span:has(small){border-radius:12px}
.gl-lab.plain>span{background:rgba(7,10,28,.6);font-weight:600}
.gl-lab.lcd>span{background:#1E2A1C;color:#B7F5A8;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;border-radius:6px;border-color:#3D5A36;letter-spacing:.04em;font-size:.82rem}
.gl-lab.tick>span{background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:#1F2B40;font-weight:800;font-size:.62rem;padding:0 2px;text-shadow:0 0 3px rgba(255,255,255,.9)}
.gl-lab.follow>span{background:#FFE066;color:#2A1B00;border-color:#FFE066}
.gl-lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gl-lead path{fill:none;stroke:rgba(255,255,255,.78);stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.55))}
.gl-lead path.ah{fill:rgba(255,255,255,.92);stroke:none}
.gl-over.day .gl-lab>span{background:rgba(255,255,255,.92);color:#0D1433;border-color:rgba(40,60,150,.28)}
.gl-over.day .gl-lead path{stroke:rgba(13,20,51,.62);filter:drop-shadow(0 0 1.5px rgba(255,255,255,.8))}
.gl-over.day .gl-lead path.ah{fill:rgba(13,20,51,.72);stroke:none}
.gl-phase{position:absolute;width:264px;border-radius:16px;padding:8px 12px 8px 8px;display:grid;grid-template-columns:86px minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:10px;align-items:center;color:var(--ink);font-size:.74rem}
.gl-phase svg{width:86px;height:86px;grid-row:1 / span 3}
.gl-phase .ph-name{font-weight:800;font-size:.8rem;line-height:1.3}
.gl-phase .ph-v{display:flex;flex-direction:column;gap:1px;color:var(--ink-2);font-weight:600}
.gl-phase .ph-k{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:3px;color:var(--muted);font-size:.66rem;font-weight:600}
.gl-phase .ph-k span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.gl-phase .ph-k i{width:10px;height:10px;border-radius:3px}
.gl-legend{position:absolute;max-width:250px;border-radius:14px;padding:9px 12px;font-size:.76rem;font-weight:700;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.gl-legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.gl-legend small{color:var(--muted);font-weight:600;line-height:1.35}
.gl-legend table.mx{border-collapse:separate;border-spacing:2px;font-size:.68rem;margin-top:2px;font-variant-numeric:tabular-nums;width:100%}
.gl-legend .mx th,.gl-legend .mx td{padding:2px 2px;text-align:center}
.gl-legend .mx thead th{font-weight:700;opacity:.82;font-size:.6rem;white-space:nowrap}
.gl-legend .mx tbody th{text-align:left;font-weight:800;padding-right:4px}
.gl-legend .mx td{border-radius:5px;height:18px;background:rgba(148,163,184,.08)}
.gl-legend .mx td.y{background:rgba(52,211,153,.24);color:#34D399;font-weight:800}
.gl-legend .mx td.n{background:rgba(148,163,184,.16);color:var(--muted);font-weight:800}
.gl-legend .mx td.x{background:none;opacity:.35}
.day .gl-legend .mx td.y,.gl-over.day .mx td.y{color:#047857}
.gl-loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--ink);pointer-events:none;transition:opacity .35s}
.gl-loading.out{opacity:0}
.gl-loading i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--stroke-hi);border-top-color:var(--sinh);animation:spin .8s linear infinite}
.gl-zoom{position:absolute;border:1.5px solid var(--stroke-hi);border-radius:8px;box-shadow:0 14px 34px -14px rgba(0,0,0,.8);pointer-events:none;overflow:hidden}
.gl-zoom .zt{height:22px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:.68rem;font-weight:800;color:var(--ink);background:var(--glass-solid);border-bottom:1px solid var(--stroke)}
.seqbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:40px;padding:8px 10px;border-radius:12px;border:1px dashed var(--stroke-hi);margin:6px 0 8px}
.seqbox .sep{opacity:.6;font-weight:800}
.mchip{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:9px;font-weight:800;color:#1B1F2E;background:#D8DCE3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.mchip.m-Cu{background:#D99268}.mchip.m-Ag{background:#EEF0F3}.mchip.m-Fe{background:#A3A8AE}.mchip.m-Zn{background:#C3CAD3}.mchip.m-Mg{background:#DCE0E6}.mchip.m-H{background:#BFDBFE}
.opts.row{display:flex;flex-wrap:wrap;gap:6px}.opts.row .opt{flex:0 0 auto;min-width:54px;justify-content:center}
.gl-fail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-2);font-weight:600}
@media (max-width:640px){.gl-lab>span{font-size:.62rem;padding:2px 7px}}
@media (max-width:980px){.gl-phase{width:214px;grid-template-columns:64px minmax(0,1fr);font-size:.68rem}.gl-phase svg{width:64px;height:64px}.gl-phase .ph-k{display:none}.gl-legend{max-width:200px;font-size:.7rem}.gl-legend small{display:none}}
/* ===== Bảng tuần hoàn đầy đủ ===== */
.ptwrap{border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.pttools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.pttools .search{margin:0;max-width:340px;flex:1 1 220px}
.pttools .search input{min-height:46px;border-radius:14px;font-size:.95rem;box-shadow:none;padding-left:46px}
.pttools .search svg{left:15px;width:19px;height:19px}

function fromHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  let m;
  if(!h){S.route="home";return}
  if((m=h.match(/^lop([6-9])$/))){S.route="grade";S.lop=+m[1];return}
  if((m=h.match(/^mach([LHS])$/))){S.route="mach";S.machPage=m[1];return}
  const e=EXP.find(x=>x.ma===h);
  if(e){S.route="exp";S.exp=e.ma;S.lop=e.lop;return}
  if(h==="lookup"){S.route=h;return}
  S.route="home";
}

const THUMB_V="13";
const FEATURED=["K6-S-01","K7-S-04","K6-T-01","K8-S-04","K8-H-03","K9-H-02","K8-L-06","K9-L-03"];
const isReady=e=>!!READY[e.ma];
const byBai=(a,b)=>a.lop-b.lop||a.baiNum-b.baiNum||a.ten.localeCompare(b.ten);
const arrowS=()=>ICON.arrow.replace("<svg","<svg width=\"18\" height=\"18\"");
const thumbImg=(e,cls)=>`<img${cls?` class="${cls}"`:""} src="thumbs/${e.ma}.webp?v=${THUMB_V}" alt="" loading="lazy" decoding="async">`;
function card(e,i){
  return `<button class="xcard m-${e.mach} tilt" data-exp="${e.ma}" data-reveal style="--i:${i||0}" aria-label="${esc(e.ten)}, lớp ${e.lop}">
   <div class="thumb shot">${thumbImg(e)}<span class="lop">Lớp ${e.lop}</span></div>
   <div class="body"><div class="subj"><span class="dot"></span>${MACH[e.mach].ten}</div><div class="title">${esc(e.ten)}</div>
   <div class="foot"><span class="meta">KHTN ${e.lop} · ${e.bai}</span><span class="arr">${arrowS()}</span></div></div></button>`;
}
const cardsHTML=list=>`<div class="cards">${list.map((e,i)=>card(e,i)).join("")}</div>`;
const srow=e=>`<div class="srow m-${e.mach}"><span class="dot"></span><span class="nm">${esc(e.ten)}</span><span class="bai">Lớp ${e.lop} · ${e.bai}</span></div>`;
function soonBox(list,title){
  if(!list.length) return "";
  return `<details class="soon-box" data-reveal><summary><span>${title||"Sắp ra mắt"}</span><span class="c">${list.length}</span></summary><div class="soonlist">${[...list].sort(byBai).map(srow).join("")}</div></details>`;
}
function readyCounts(list){
  const r=list.filter(isReady);
  return ORDER.map(m=>[m,cnt(r,e=>e.mach===m)]).filter(x=>x[1]);
}

/* ========== KHÁM PHÁ ========== */
function shotScene(list,fallback){
  const r=list.filter(isReady).slice(0,2);
  if(!r.length) return `<div class="scene-wrap">${fallback}</div>`;
  return `<div class="scene-wrap shotmix ${r.length===1?"one":""}">${r.map(e=>thumbImg(e)).join("")}</div>`;
}

/* ========== DANH SÁCH (lớp / mạch) ========== */
function listView(list,groupOrder){
  const sort=S.sort||(isGV()?"bai":"mach");
  const ready=list.filter(isReady);
  const present=groupOrder.filter(m=>ready.some(e=>e.mach===m));
  if(S.filter!=="all"&&!present.includes(S.filter)) S.filter="all";
  const pass=e=>S.filter==="all"||e.mach===S.filter;
  const shown=ready.filter(pass),soon=list.filter(e=>!isReady(e)).filter(e=>S.filter==="all"||e.mach===S.filter);
  const filters=ready.length?`<div class="filters">
   <div class="chips" role="group" aria-label="Lọc theo mạch">
    <button class="chip all" data-filter="all" aria-pressed="${S.filter==="all"}">Tất cả <span class="c">${ready.length}</span></button>
    ${present.map(m=>`<button class="chip m-${m}" data-filter="${m}" aria-pressed="${S.filter===m}"><span class="dot"></span>${MACH[m].ten} <span class="c">${cnt(ready,e=>e.mach===m)}</span></button>`).join("")}
   </div>
   <div class="seg" role="group" aria-label="Cách sắp xếp"><button data-sort="mach" aria-pressed="${sort==="mach"}">Theo mạch</button><button data-sort="bai" aria-pressed="${sort==="bai"}">Theo bài SGK</button></div></div>`:"";
  let body;
  if(!shown.length) body=`<div class="empty" data-reveal>Các thí nghiệm của phần này sắp ra mắt.</div>`;
  else if(sort==="bai") body=cardsHTML([...shown].sort(byBai));
  else body=present.filter(m=>S.filter==="all"||S.filter===m).map(m=>{const g=shown.filter(e=>e.mach===m).sort(byBai);if(!g.length)return"";
      return `<section class="group m-${m}"><div class="group-h"><span class="dot"></span><h2>${MACH[m].ten}</h2><span class="muted num">${g.length}</span><span class="line"></span></div>${cardsHTML(g)}</section>`}).join("");
  return filters+`<div class="stack" style="gap:24px">${body}${soonBox(soon)}</div>`;
}
function viewGrade(){
  const list=byLop(S.lop),n=list.filter(isReady).length;
  return `<div class="stack" style="gap:20px">
   <div class="crumbs"><button data-go="">Khám phá</button><span>/</span><span>Lớp ${S.lop}</span></div>
   <section class="band glass g${S.lop}" data-reveal>
    <div class="info"><div class="eyebrow">Sách Kết nối tri thức</div><h1>Khoa học tự nhiên ${S.lop}</h1><p class="muted">${GRADE[S.lop].t} · ${n?`${n} thí nghiệm sẵn sàng`:"sắp ra mắt"}</p>
    ${readyCounts(list).length?`<div class="pcount">${readyCounts(list).map(([m,c])=>`<span class="m-${m}"><span class="dot"></span>${MACH[m].ten} <b>${c}</b></span>`).join("")}</div>`:""}</div>
    ${shotScene(list,SCENE[S.lop]())}
   </section>
   ${listView(list,ORDER)}
  </div>`;
}
function viewMach(){
  const P=MACHPAGE[S.machPage];const list=EXP.filter(e=>P.codes.includes(e.mach));const ready=list.filter(isReady);
  return `<div class="stack m-${S.machPage}" style="gap:20px">
   <div class="crumbs"><button data-go="">Khám phá</button><span>/</span><span>${P.ten}</span></div>
   <section class="band glass" data-reveal style="background:linear-gradient(150deg,color-mix(in srgb,var(--m) 30%,var(--glass-solid)),var(--glass-solid) 70%)">
    <div class="info"><div class="eyebrow">Mạch nội dung</div><h1>${P.ten}</h1><p class="muted">${P.sub} · ${ready.length} thí nghiệm sẵn sàng</p></div>
    ${shotScene(list,MSCENE[S.machPage]())}
   </section>
   ${byGradeBlocks(list)}
  </div>`;
}
function byGradeBlocks(list){
  const blocks=[6,7,8,9].map(l=>{const g=list.filter(e=>e.lop===l&&isReady(e)).sort(byBai);if(!g.length)return"";
   return `<section class="group"><div class="group-h"><h2>Lớp ${l}</h2><span class="muted num">${g.length}</span><span class="line" style="--m:var(--ink-2)"></span></div>${cardsHTML(g)}</section>`}).join("");
  return (blocks||`<div class="empty">Các thí nghiệm của mạch này sắp ra mắt.</div>`)+soonBox(list.filter(e=>!isReady(e)));
}

const MODS={};

const _scripts={};
function loadScript(src){return _scripts[src]||(_scripts[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>{delete _scripts[src];rej(new Error("Không tải được "+src))};document.head.appendChild(s)}))}
async function loadMod(ma){
  if(MODS[ma]) return MODS[ma];
  await loadScript("exp/_core.js?v="+CORE_V+"."+BUILD);
  for(const d of (READY[ma].deps||[])) await loadScript("exp/"+d+".js?v="+CORE_V+"."+BUILD);
  await loadScript("exp/"+ma+".js?v="+READY[ma].v+"."+BUILD);
  if(!MODS[ma]) throw new Error("Tệp exp/"+ma+".js không đăng kí thí nghiệm");
  return MODS[ma];
}
let RT=null;
const fmtVN=(x,d)=>Number(x).toFixed(d).replace(".",",");
function vpSafe(){
  const vp=document.getElementById("vp"); if(!vp) return {x:0,y:0,w:0,h:0};
  const r=vp.getBoundingClientRect(); let L=14,R=14,T=14,B=14;
  const over=el=>el&&el.offsetParent!==null&&getComputedStyle(el).position==="absolute";
  const dock=document.querySelector("#studio .dock"),guide=document.querySelector("#studio .guide"),tb=document.getElementById("tb"),gt=document.querySelector("#studio .gtoggle");
  if(over(dock)){const d=dock.getBoundingClientRect();L=Math.max(L,d.right-r.left+12)}
  if(over(guide)){const g=guide.getBoundingClientRect();R=Math.max(R,r.right-g.left+12)}
  if(over(tb)){const t=tb.getBoundingClientRect();B=Math.max(B,r.bottom-t.top+10)}
  if(over(gt)){const t=gt.getBoundingClientRect();T=Math.max(T,t.bottom-r.top+8)}
  return {x:L,y:T,w:Math.max(80,r.width-L-R),h:Math.max(80,r.height-T-B),W:r.width,H:r.height};
}
function dockMore(d){if(!d||d._more)return;d._more=1;const box=d.closest(".dock");const up=()=>{const m=d.scrollHeight>d.clientHeight+d.scrollTop+4&&getComputedStyle(d).flexDirection==="column";d.classList.toggle("more",m);if(box)box.classList.toggle("has-more",m)};
  d.addEventListener("scroll",up,{passive:true});if(window.ResizeObserver)new ResizeObserver(up).observe(d);new MutationObserver(()=>requestAnimationFrame(up)).observe(d,{childList:true,subtree:true});up()}
function mountExp(e){
  const token={};
  RT={ma:e.ma,token,step:0,ok:[false,false,false,false],rows:[],playing:true,speed:1,inst:null,mod:null,onReset:null,ro:null,resetArm:0};
  loadMod(e.ma).then(mod=>{
    if(!RT||RT.token!==token) return;
    RT.mod=mod;
    const vp=document.getElementById("vp");

    const api={
      ma:e.ma, vp, dock:document.getElementById("dock"),

      safe:vpSafe,

      okAt(i,flag){if(!RT)return;RT.ok[i]=flag!==false;guideChrome()},
      get step(){return RT?RT.step:0},
      goStep(i){setStep(i,true)},
      record(row){if(!RT)return;RT.rows.push(row);renderTable(true)},
      rows(){return RT?RT.rows.slice():[]},
      toast,
      card:showCard, closeCard,
      time:{get playing(){return RT?RT.playing:false},get speed(){return RT?RT.speed:1},
        label(t,p){const l=document.getElementById("tbLabel"),f=document.getElementById("tbFill");if(l)l.textContent=t;if(f)f.style.width=(p==null?0:Math.max(0,Math.min(1,p))*100)+"%"},
        onReset(fn){if(RT)RT.onReset=fn}, play(b){if(RT){RT.playing=b!==false;tbChrome()}}},
      done:showDone,
      store:{get:(k,d)=>store.get(e.ma+":"+k,d),set:(k,v)=>store.set(e.ma+":"+k,v)},
      css:n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),
      fmt:fmtVN
    };
    document.getElementById("gGVin").innerHTML=mod.gv||"";
    document.getElementById("gSrcIn").innerHTML=mod.sources||"";
    RT.inst=mod.mount(api)||{};

    if(window.ResizeObserver){RT.ro=new ResizeObserver(()=>{RT&&RT.inst&&RT.inst.layout&&RT.inst.layout()});RT.ro.observe(vp)}
  }).catch(err=>{
    const ld=document.getElementById("vpLoad");

  });
}

function setStep(i,user){
  if(!RT||!RT.mod) return;
  i=Math.max(0,Math.min(3,i));
  if(user&&!reachable(i)){toast("Hoàn thành bước "+(RT.step+1)+" trước đã.","warn");return}
  RT.step=i;
  const body=document.getElementById("gBody");
  body.innerHTML=""; const gi=document.querySelector("#studio .guide-in"); if(gi) gi.scrollTop=0;
  try{RT.inst.step&&RT.inst.step(i,body)}catch(err){body.innerHTML=`<p class="muted">Lỗi hiển thị bước: ${esc(err.message)}</p>`}
  guideChrome();

function guideChrome(){
  if(!RT||!RT.mod) return;

  st.innerHTML=names.map((n,i)=>`<button class="step ${RT.ok[i]&&i!==RT.step?"done":""}" data-step="${i}" ${i===RT.step?'aria-current="step"':""} ${reachable(i)?"":"disabled"}><b>${RT.ok[i]&&i!==RT.step?"✓":i+1}</b>${n}</button>`).join("");

function bohr(el){
  const rs=[30,50,70,90],sp=[6,10,14,18];
  let s=`<svg class="bohr" viewBox="0 0 220 220" role="img" aria-label="Mô hình nguyên tử ${el.n}: ${el.sh.join(", ")} electron theo lớp">
   <defs><radialGradient id="nuc" cx=".4" cy=".35"><stop offset="0" stop-color="#FFC1D6"/><stop offset="1" stop-color="#C2185B"/></radialGradient>
   <radialGradient id="eball" cx=".35" cy=".3"><stop offset="0" stop-color="#E0F2FF"/><stop offset=".45" stop-color="#60A5FA"/><stop offset="1" stop-color="#1D4ED8"/></radialGradient></defs>`;
  el.sh.forEach((n,i)=>{const r=rs[i];
   s+=`<circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--stroke-hi)" stroke-width="1.5"/><g class="shell" style="animation-duration:${sp[i]}s${i%2?";animation-direction:reverse":""}">`;
   for(let k=0;k<n;k++){const a=-Math.PI/2+k*2*Math.PI/n;s+=`<circle cx="${(110+r*Math.cos(a)).toFixed(1)}" cy="${(110+r*Math.sin(a)).toFixed(1)}" r="6.5" fill="url(#eball)"/>`}
   s+=`</g>`;});
  s+=`<circle cx="110" cy="110" r="19" fill="url(#nuc)"/><text x="110" y="115" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Lexend,sans-serif">+${el.z}</text></svg>`;
  return s;
}
