    <div class="seg" role="group" aria-label="Cách tô màu"><button data-ptmode="detail" aria-pressed="${S.ptMode!=="sgk"}">Theo loại chi tiết</button><button data-ptmode="sgk" aria-pressed="${S.ptMode==="sgk"}">Kim loại – phi kim (SGK)</button></div></div>
   <section class="ptwrap glass">
    <div class="pttools"><div class="search">${ICON.search}<input type="search" id="ptq" placeholder="Tìm: Na, natri, sắt, 26…" value="${esc(S.ptQ)}" autocomplete="off" aria-label="Tìm nguyên tố"></div>
     <div class="seg" role="group" aria-label="Cỡ ô"><button data-ptsize="small" aria-pressed="${S.ptSize==="small"}">Nhỏ</button><button data-ptsize="" aria-pressed="${!S.ptSize}">Vừa</button><button data-ptsize="large" aria-pressed="${S.ptSize==="large"}">Lớn</button></div></div>
    <div class="ptlegend" role="group" aria-label="Chú giải, bấm để làm nổi">${legend}</div>
    ${ptDetail(e,true)}
    <div class="ptscroll" style="margin-top:12px"><div class="pt18 ${S.ptSize||""} ${dim?"dim":""}" id="pt18">${g}</div></div>
    <p class="ptnote">Nguyên tử khối theo bảng chuẩn của IUPAC; số trong ngoặc vuông là số khối của đồng vị bền nhất. Chấm vàng ở góc ô: nguyên tố phóng xạ. Mô hình lớp electron vẽ cho 20 nguyên tố đầu, theo cách xếp trong SGK KHTN 7.</p>
   </section></div>`;
}

/* ========== VẼ ========== */
function applyPrefs(){
  const r=document.documentElement;
  r.classList.toggle("big",!!S.big); r.classList.toggle("day",!!S.day); r.classList.toggle("nomotion",!S.fx);
  document.getElementById("bigBtn").setAttribute("aria-pressed",String(!!S.big));
  document.getElementById("dayBtn").setAttribute("aria-pressed",String(!!S.day));
  document.getElementById("fxBtn").setAttribute("aria-pressed",String(!!S.fx));
  document.getElementById("modeHS").setAttribute("aria-pressed",String(S.mode==="hs"));
  document.getElementById("modeGV").setAttribute("aria-pressed",String(S.mode==="gv"));
}
function syncSVG(){document.querySelectorAll("#app svg").forEach(s=>{try{if(S.fx){s.unpauseAnimations&&s.unpauseAnimations()}else{s.setCurrentTime&&s.setCurrentTime(2.2);s.pauseAnimations&&s.pauseAnimations()}}catch(e){}})}
function render(){
  applyPrefs(); renderNav();
  if(S.route==="exp"&&RT&&RT.ma===S.exp&&document.getElementById("studio")){updateStudio();return}
  unmountExp();
  const v={home:viewHome,grade:viewGrade,mach:viewMach,exp:viewExp,lookup:viewLookup}[S.route]||viewHome;
  $app.className="wrap"+(S.route==="exp"?" wide":"");
  $app.parentElement.classList.toggle("tight",S.route==="exp");
  document.body.classList.toggle("presenting",S.route==="exp"&&S.present);
  $app.innerHTML=v();
  syncSVG();
  const q=document.getElementById("q");
  if(q) q.addEventListener("input",ev=>{S.q=ev.target.value;const p=ev.target.selectionStart;render();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(p,p)}catch(e){}});
  const pq=document.getElementById("ptq");
  if(pq) pq.addEventListener("input",ev=>{S.ptQ=ev.target.value;const hit=PT.find(x=>ptMatch(x,S.ptQ));if(hit)S.el=hit.z;const p=ev.target.selectionStart;render();const n=document.getElementById("ptq");n.focus();try{n.setSelectionRange(p,p)}catch(e){}});
  initReveal();
  fx.recolor();
  if(S.route==="exp"){fx.stop();const e=EXP.find(x=>x.ma===S.exp);if(e&&READY[e.ma])mountExp(e)}else if(S.fx){fx.start()}
}

/* ========== SỰ KIỆN ========== */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button,[data-go]"); if(!t) return;
  const d=t.dataset;
  if(t.hasAttribute("data-go")){go(t.getAttribute("data-go"));return}
  if(d.exp){go(d.exp);return}
  if(d.gvlop){S.sort="bai";go("lop"+d.gvlop);return}
  if(d.filter){S.filter=d.filter;render();return}
  if(d.sort){S.sort=d.sort;render();return}
  if(d.step!==undefined){if(RT&&RT.mod){setStep(+d.step,true)}else{S.step=+d.step;render()}return}
  if(d.move){if(RT&&RT.mod){setStep(RT.step+(+d.move),true)}else{S.step=Math.max(0,Math.min(3,S.step+(+d.move)));render()}return}
  if(d.spd&&RT){RT.speed=+d.spd;tbChrome();return}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.el){S.el=+d.el;render();if(window.innerWidth<=1100){const m=document.querySelector(".ptmob");if(m&&m.getBoundingClientRect().top<70)m.scrollIntoView({behavior:S.fx?"smooth":"auto",block:"start"})}return}
  if(d.pthl!==undefined){S.ptHl=S.ptHl===d.pthl?null:d.pthl;render();return}
  if(d.ptmode){S.ptMode=d.ptmode;S.ptHl=null;store.set("ptMode",S.ptMode);render();return}
  if(d.ptsize!==undefined){S.ptSize=d.ptsize;render();return}
  switch(t.id){
    case "presentBtn":S.present=!S.present;render();break;
    case "guideClose":S.guideOpen=false;render();break;
    case "guideOpen":S.guideOpen=true;render();break;
    case "fullBtn":{const el=document.getElementById("studio");
      try{if(document.fullscreenElement){document.exitFullscreen()}else if(el&&el.requestFullscreen){el.requestFullscreen().catch(()=>{})}}catch(e){} break;}
    case "modeHS":S.mode="hs";S.sort=null;S.present=false;store.set("mode","hs");render();break;
    case "modeGV":S.mode="gv";S.sort=null;store.set("mode","gv");render();break;
    case "bigBtn":S.big=!S.big;store.set("big",S.big);render();break;
    case "dayBtn":S.day=!S.day;store.set("day",S.day);render();break;
    case "fxBtn":S.fx=!S.fx;store.set("fx",S.fx);render();if(S.route!=="exp")fx.toggle();break;
    case "tbPlay":if(RT){RT.playing=!RT.playing;tbChrome()}break;
    case "tbReset":if(RT){if(RT.resetArm){clearTimeout(RT.resetArm);RT.resetArm=0;closeCard();const o=document.getElementById("doneOv");if(o)o.remove();try{RT.onReset&&RT.onReset()}catch(e){}toast("Đã đặt lại thí nghiệm. Bảng đo vẫn giữ.","info")}else{RT.resetArm=setTimeout(()=>{if(RT){RT.resetArm=0;tbChrome()}},3000)}tbChrome()}break;
    case "closeCard":closeCard();break;
    case "doneClose":{const o=document.getElementById("doneOv");if(o)o.remove();break;}
    case "copyTable":if(RT&&RT.rows.length){const txt=tableTSV();try{navigator.clipboard.writeText(txt).then(()=>toast("Đã sao chép bảng. Dán vào Word, Excel hoặc Google Sheets.","ok"),()=>toast("Trình duyệt chặn sao chép. Bôi đen bảng rồi bấm Ctrl+C.","warn"))}catch(e){toast("Trình duyệt chặn sao chép. Bôi đen bảng rồi bấm Ctrl+C.","warn")}}else{toast("Bảng đo còn trống.","info")}break;
    case "clearTable":if(RT){if(t.dataset.arm){RT.rows=[];renderTable(false);delete t.dataset.arm;t.textContent="Xóa bảng"}else{t.dataset.arm="1";t.textContent="Bấm lần nữa để xóa";setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="Xóa bảng"}},3000)}}break;
  }
});
document.addEventListener("keydown",ev=>{
  if(S.route!=="exp"||ev.target.matches("input,select,textarea,button,[contenteditable]")) return;
  if(RT&&RT.mod){
    if(ev.key===" "){ev.preventDefault();RT.playing=!RT.playing;tbChrome();return}
    if(ev.key==="ArrowRight"&&ev.altKey){setStep(RT.step+1,true)}
    if(ev.key==="ArrowLeft"&&ev.altKey){setStep(RT.step-1,true)}
    return;
  }
  if(ev.key==="ArrowRight"){S.step=Math.min(3,S.step+1);render()}
  if(ev.key==="ArrowLeft"){S.step=Math.max(0,S.step-1);render()}
});
/* nghiêng 3D theo con trỏ */
const finePointer=window.matchMedia&&matchMedia("(pointer:fine)").matches;
document.addEventListener("pointermove",ev=>{
  if(!finePointer||!S.fx) return;
  const t=ev.target.closest&&ev.target.closest(".tilt");
  document.querySelectorAll(".tilt[data-tilting]").forEach(x=>{if(x!==t){x.style.transform="";x.removeAttribute("data-tilting")}});
  if(!t) return;
  const r=t.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
  t.setAttribute("data-tilting","");
  t.style.transform=`perspective(1000px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*7).toFixed(2)}deg) translateY(-4px)`;
  t.style.setProperty("--mx",((x+.5)*100).toFixed(1)+"%");t.style.setProperty("--my",((y+.5)*100).toFixed(1)+"%");
});

/* ========== NỀN HẠT CHUYỂN ĐỘNG ========== */
const fx=(function(){
  const cv=document.getElementById("fx"),ctx=cv.getContext("2d");
  let W=0,H=0,pts=[],raf=null,cols=[],mouse={x:-999,y:-999},linkRGB="150,170,255";
  function recolor(){const cs=getComputedStyle(document.documentElement);cols=["--ly2","--hoa2","--sinh2","--star"].map(v=>cs.getPropertyValue(v).trim()||"#fff");linkRGB=cs.getPropertyValue("--link-rgb").trim()||linkRGB}
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(72,Math.max(26,W*H/24000)));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.7+.8,c:Math.floor(Math.random()*4)}));}
  function draw(move){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      if(move){const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);if(d<180){p.vx+=dx/d*.012;p.vy+=dy/d*.012}
        p.vx*=.992;p.vy*=.992;const sp=Math.hypot(p.vx,p.vy);if(sp<.08){p.vx+=(Math.random()-.5)*.05;p.vy+=(Math.random()-.5)*.05}if(sp>.9){p.vx*=.9;p.vy*=.9}
        p.x+=p.vx;p.y+=p.vy;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;}
    }
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){ctx.strokeStyle=`rgba(${linkRGB},${(1-d/130)*.28})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
    for(const p of pts){ctx.fillStyle=cols[p.c];ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,6.283);ctx.fill();ctx.globalAlpha=1}
  }
  function loop(){draw(true);raf=requestAnimationFrame(loop)}
  function start(){if(raf||!S.fx||document.hidden) return;loop()}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=null}draw(false)}
  function toggle(){S.fx?start():stop()}
  window.addEventListener("resize",()=>{size();if(!raf)draw(false)});
  window.addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY},{passive:true});
  document.addEventListener("visibilitychange",()=>{document.hidden?(raf&&(cancelAnimationFrame(raf),raf=null)):start()});
  recolor();size();
  return {start,stop,toggle,recolor:()=>{recolor();if(!raf)draw(false)}};
})();

/* xuất hiện dần khi cuộn tới */
let revealIO=null;
function initReveal(){
  const els=[...document.querySelectorAll("#app [data-reveal]:not(.in)")];
  if(!revealIO||!S.fx){els.forEach(x=>x.classList.add("in"));return}
  els.forEach(x=>revealIO.observe(x));
}
if("IntersectionObserver" in window){
  revealIO=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");revealIO.unobserve(en.target)}})},{rootMargin:"0px 0px -4% 0px",threshold:.05});
  document.documentElement.classList.add("rv");
}
const topBar=document.querySelector(".top");
window.addEventListener("scroll",()=>{topBar.classList.toggle("scrolled",window.scrollY>6)},{passive:true});
fromHash(); render(); S.fx?fx.start():fx.stop();
})();
</script>
